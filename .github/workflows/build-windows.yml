name: build-windows-exe
# Builds the SheetFix Windows package on a GitHub-hosted Windows runner.
# Trigger manually (Actions tab -> Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "spreadsheet-auditor[all]" openpyxl pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller sheetfix.spec --distpath dist --workpath buildwork
      - name: Verify exe exists
        run: |
          if (-not (Test-Path dist/SheetFix/SheetFix.exe)) { throw "SheetFix.exe missing" }
      - name: Package zip
        run: Compress-Archive -Path dist/SheetFix -DestinationPath SheetFix-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SheetFix-Windows
          path: SheetFix-Windows.zip
